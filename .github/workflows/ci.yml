name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  DATABASE_URL: postgresql://deskly:deskly_ci@127.0.0.1:5432/deskly_ci?schema=public
  JWT_SECRET: ci-secret-change-me
  PAYMENT_GATEWAY: FAKE

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar areas modificadas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            mobile:
              - 'mobile/**'
            docker:
              - 'backend/Dockerfile'
              - 'mobile/Dockerfile'
              - 'docker-compose*.yml'
              - '.dockerignore'
            workflow:
              - '.github/workflows/**'

  backend-quality:
    name: Backend calidad
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm prisma:generate

      - name: Validar esquema Prisma
        run: pnpm exec prisma validate

      - name: Validar formato
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint sin modificar archivos
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

  backend-unit-tests:
    name: Backend tests unitarios
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm prisma:generate

      - name: Preparar reportes
        run: mkdir -p reports

      - name: Ejecutar tests unitarios con cobertura
        run: pnpm test:cov -- --ci --runInBand --json --outputFile=reports/jest-results.json

      - name: Subir cobertura backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn

      - name: Subir resultados backend unitarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: backend/reports/jest-results.json
          if-no-files-found: warn

  backend-e2e:
    name: Backend E2E PostgreSQL
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deskly_ci
          POSTGRES_USER: deskly
          POSTGRES_PASSWORD: deskly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deskly -d deskly_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm prisma:generate

      - name: Ejecutar migraciones Prisma
        run: pnpm exec prisma migrate deploy

      - name: Preparar reportes
        run: mkdir -p reports

      - name: Ejecutar tests E2E
        run: pnpm test:e2e -- --runInBand --json --outputFile=reports/jest-e2e-results.json

      - name: Subir resultados backend E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-test-results
          path: backend/reports/jest-e2e-results.json
          if-no-files-found: warn

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar backend
        run: pnpm build

  mobile-quality:
    name: Mobile calidad
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar TypeScript
        run: pnpm exec tsc --noEmit

  mobile-tests:
    name: Mobile tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Preparar reportes
        run: mkdir -p reports

      - name: Ejecutar tests mobile con cobertura
        run: pnpm test -- --ci --runInBand --coverage --json --outputFile=reports/jest-results.json

      - name: Subir cobertura mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: warn

      - name: Subir resultados mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: mobile/reports/jest-results.json
          if-no-files-found: warn

  mobile-export:
    name: Mobile Expo export
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.workflow == 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar bundle Expo
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Subir bundle Expo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-expo-export
          path: mobile/dist
          if-no-files-found: warn

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen backend sin publicar
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: false
          load: false
          tags: deskly-backend:ci

      - name: Construir imagen mobile sin publicar
        uses: docker/build-push-action@v6
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          target: development
          push: false
          load: false
          tags: deskly-mobile:ci
